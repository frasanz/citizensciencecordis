name: Actualizar datos y publicar

on:
  schedule:
    # CORDIS publica sus volcados a principios de mes; se recogen el dia 8 a las 04:00 UTC
    - cron: '0 4 8 * *'
  workflow_dispatch:        # boton "Run workflow" en la pestana Actions
  push:
    branches: [main]

permissions:
  contents: write           # para commitear los datos nuevos
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Solo se recalcula en las ejecuciones programadas o manuales. Un push
      # publica lo que ya hay en el repo, sin volver a bajar 125 MB de CORDIS.
      - uses: actions/setup-node@v4
        if: github.event_name != 'push'
        with:
          node-version: '22'

      # FECYT solo publica sus concesiones en PDF: pdftotext (poppler) las convierte.
      - name: Instalar poppler para leer los PDF de FECYT
        if: github.event_name != 'push'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Recalcular indicadores desde CORDIS, LIFE, AEI, FECYT y Fundación Biodiversidad
        if: github.event_name != 'push'
        run: node scripts/snapshot.js --sin-cache   # sin dependencias de npm: fflate va en vendor/

      - name: Guardar los datos si han cambiado
        if: github.event_name != 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data datos/life-paises-pendientes.csv datos/ccaa-entidades-pendientes.csv
          if git diff --staged --quiet; then
            echo "Ninguna fuente ha cambiado nada desde la ultima vez."
          else
            git commit -m "Datos de CORDIS, LIFE, AEI, FECYT y Fundación Biodiversidad a $(date -u +%Y-%m-%d)"
            git push
          fi

      # Pages hay que habilitarlo una sola vez con permisos de administracion,
      # porque el token del workflow no puede crear el sitio (falla con
      # "Resource not accessible by integration"). Hecho ya con:
      #   gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow
      # o en Ajustes > Pages > Source: GitHub Actions.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
