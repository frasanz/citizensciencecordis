name: Actualizar datos y publicar

on:
  schedule:
    # CORDIS publica sus volcados a principios de mes; se recogen el dia 8 a las 04:00 UTC
    - cron: '0 4 8 * *'
  workflow_dispatch:        # boton "Run workflow" en la pestana Actions
  push:
    branches: [main]

permissions:
  contents: write           # para commitear los datos nuevos
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Solo se recalcula en las ejecuciones programadas o manuales. Un push
      # publica lo que ya hay en el repo, sin volver a bajar 125 MB de CORDIS.
      - uses: actions/setup-node@v4
        if: github.event_name != 'push'
        with:
          node-version: '22'

      - name: Recalcular indicadores desde CORDIS
        if: github.event_name != 'push'
        run: node scripts/snapshot.js --sin-cache   # sin dependencias: fflate va en vendor/

      - name: Guardar los datos si han cambiado
        if: github.event_name != 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data
          if git diff --staged --quiet; then
            echo "CORDIS no ha cambiado nada desde la ultima vez."
          else
            git commit -m "Datos de CORDIS a $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
